name: ai-news

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intel}
      POSTGRES_DB: intel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel -d intel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    # S3-compatible object store for immutable raw evidence. (MinIO pulled
    # its images from public registries in late 2025; SeaweedFS is actively
    # published and speaks the same S3 API.)
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -volume.max=100
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9333:9333"   # master UI
    volumes:
      - s3data:/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://intel:${POSTGRES_PASSWORD:-intel}@db:5432/intel
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://seaweedfs:9000
      S3_ACCESS_KEY: any
      S3_SECRET_KEY: any
      S3_BUCKET: raw-evidence
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    command: sh -c "PYTHONPATH=/app uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"


  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://intel:${POSTGRES_PASSWORD:-intel}@db:5432/intel
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://seaweedfs:9000
      S3_ACCESS_KEY: any
      S3_SECRET_KEY: any
      S3_BUCKET: raw-evidence
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
    command: sh -c "PYTHONPATH=/app arq app.worker.WorkerSettings"

  mcp:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://intel:${POSTGRES_PASSWORD:-intel}@db:5432/intel
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://seaweedfs:9000
      S3_ACCESS_KEY: any
      S3_SECRET_KEY: any
      S3_BUCKET: raw-evidence
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
    command: sh -c "PYTHONPATH=/app python -m app.mcp_server"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server components run inside the compose network; browsers use the
      # public URL above.
      API_INTERNAL_URL: http://backend:8000
      # This compose stack is what the public tunnel serves — hide the
      # analyst feedback controls, the write guard would reject them anyway.
      NEXT_PUBLIC_READ_ONLY: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
  s3data:
