[project]
name = "ai-news-backend"
version = "0.1.0"
description = "Real-time intelligence system for offensive AI and enterprise AI adoption"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "arq>=0.26",
    "redis>=5.0",
    "boto3>=1.34",
    "tenacity>=8.3",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
